name: Trusted Docs Source Successor V1

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-source-successor-v1:
    name: docs-source-successor-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - id: materialize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("node:fs/promises");
            const path = require("node:path");
            const pull = context.payload.pull_request;
            const repo = context.repo;
            const oid = /^(?!0{40}$)[0-9a-f]{40}$/u;
            const need = (condition, message) => { if (!condition) throw new Error(message); };
            need(Number.isSafeInteger(pull?.number) && pull.number > 0 &&
              Number.isSafeInteger(pull?.changed_files) && pull.changed_files >= 1 && pull.changed_files <= 32,
              "Invalid PR identity or changed_files; expected a positive PR and 1..32 files.");
            need(oid.test(pull.base?.sha) && oid.test(pull.head?.sha) &&
              pull.head?.repo?.full_name === `${repo.owner}/${repo.repo}`, "Missing revisions or foreign source repository.");
            async function readLive() {
              const controller = (await github.rest.repos.get(repo)).data;
              need(typeof controller.default_branch === "string" && controller.default_branch &&
                pull.base.ref === controller.default_branch, "PR must target the live default branch.");
              const branch = (await github.rest.repos.getBranch({ ...repo, branch: controller.default_branch })).data;
              need(branch.commit?.sha === pull.base.sha, "PR base is stale.");
              const live = (await github.rest.pulls.get({ ...repo, pull_number: pull.number })).data;
              need(live.state === "open" && live.base?.sha === pull.base.sha && live.head?.sha === pull.head.sha &&
                live.base?.ref === pull.base.ref && live.head?.repo?.full_name === pull.head.repo.full_name &&
                live.changed_files === pull.changed_files, "PR metadata changed or is incomplete.");
              return { state: live.state, pullRequest: live.number, repository: live.head.repo.full_name,
                baseSHA: live.base.sha, headSHA: live.head.sha, sourceSHA: live.head.sha,
                baseRef: live.base.ref, defaultBranch: controller.default_branch,
                headRepository: live.head.repo.full_name, changedFiles: live.changed_files };
            }
            const first = await readLive();
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number: pull.number, per_page: 100
            });
            need(files.length === pull.changed_files && new Set(files.map(file => file?.filename)).size === files.length,
              "Changed-file pagination is incomplete or duplicated.");
            async function tree(revision) {
              const commit = (await github.rest.git.getCommit({ ...repo, commit_sha: revision })).data;
              need(commit?.sha === revision && oid.test(commit.tree?.sha), "Unbound Git commit.");
              const data = (await github.rest.git.getTree({ ...repo, tree_sha: commit.tree.sha, recursive: "true" })).data;
              need(data?.sha === commit.tree.sha && data.truncated === false && Array.isArray(data.tree),
                "Incomplete or unbound Git tree.");
              return data;
            }
            const baseTree = await tree(pull.base.sha);
            const headTree = await tree(pull.head.sha);
            const successorInputPaths = [
              "scripts/check-docs-source-successor-v1.mts",
              "scripts/check-docs-source-successor-v1.test.mts",
              ".github/workflows/docs-source-successor-v1.yml",
              "docs/decisions/0009-bounded-docs-source-successor.md",
              "tsconfig.docs-source-successor.json",
            ];
            const inputEvidence = (data) => Object.fromEntries(successorInputPaths.map(filePath => {
              const entries = data.tree.filter(entry => entry?.path === filePath);
              need(entries.length <= 1, "Duplicate successor input tree entry.");
              const entry = entries[0];
              return [filePath, entry ? { path: entry.path, mode: entry.mode, type: entry.type, sha: entry.sha } : null];
            }));
            const baseInputs = inputEvidence(baseTree), headInputs = inputEvidence(headTree);
            const headData = {};
            for (const filePath of ["package.json", "pnpm-lock.yaml"]) {
              const entries = headTree.tree.filter(entry => entry?.path === filePath);
              need(entries.length === 1 && entries[0].type === "blob" && entries[0].mode === "100644" &&
                Number.isSafeInteger(entries[0].size) && entries[0].size > 0 &&
                entries[0].size <= (filePath === "package.json" ? 65536 : 2 * 1024 * 1024),
                "Invalid or oversized install data.");
              const blob = (await github.rest.git.getBlob({ ...repo, file_sha: entries[0].sha })).data;
              need(blob?.sha === entries[0].sha && blob.encoding === "base64" && typeof blob.content === "string" &&
                blob.size === entries[0].size && blob.content.length <= 3 * 1024 * 1024, "Incomplete or unbound install data.");
              headData[filePath] = blob;
            }
            const live = await readLive();
            need(JSON.stringify(live) === JSON.stringify(first), "Live PR or current-default drift during evidence collection.");
            const output = path.join(process.env.RUNNER_TEMP, "docs-source-successor-v1.json");
            await fs.writeFile(output, JSON.stringify({
              repository: `${repo.owner}/${repo.repo}`, pullRequest: pull.number,
              base: "5abed741aff64506d0e9f87f76541a4e93af7e4a",
              reviewTarget: "c6db8ef6761261581c7564e2c9bea4a5faef135a",
              baseSHA: pull.base.sha, headSHA: pull.head.sha, sourceSHA: live.head.sha,
              baseRef: pull.base.ref, defaultBranch: live.defaultBranch, headRepository: live.headRepository,
              changedFiles: pull.changed_files, files, paginationComplete: true,
              baseTree, headTree, baseInputs, headInputs, headData, live
            }), { flag: "wx" });
            core.setOutput("evidence-path", output);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Install only trusted base dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Compare source evidence with trusted base successor guard
        env:
          AUTHORITY_EVIDENCE: ${{ steps.materialize.outputs.evidence-path }}
        run: node scripts/check-docs-source-successor-v1.mts "$AUTHORITY_EVIDENCE"
