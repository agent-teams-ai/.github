name: ReviewRouter Interaction

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions: {}

jobs:
  interaction:
    name: interaction
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: agent-teams-ai/.github/.github/workflows/reviewrouter-interaction-reusable.yml@18fe8dac76d85f421c3e90489322474f7e76578f
    with:
      discussion_mode: ${{ vars.REVIEW_ROUTER_DISCUSSION_MODE || 'off' }}
      discussion_max_per_pr: ${{ vars.REVIEW_ROUTER_DISCUSSION_MAX_PER_PR || '20' }}
      discussion_max_per_thread: ${{ vars.REVIEW_ROUTER_DISCUSSION_MAX_PER_THREAD || '5' }}
      discussion_timeout_seconds: ${{ vars.REVIEW_ROUTER_DISCUSSION_TIMEOUT_SECONDS || '60' }}
      codex_model: ${{ vars.REVIEW_CODEX_MODEL || 'gpt-5.5' }}
      codex_reasoning_effort: ${{ vars.REVIEW_CODEX_EFFORT || 'xhigh' }}
    secrets:
      REVIEWROUTER_CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
      REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEW_ROUTER_LEDGER_KEY }}
