name: Trusted Docs Admission Authority Evolution V1

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-admission-authority-evolution-v1:
    name: trusted-admission-authority-evolution-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const workflowPath = ".github/workflows/docs-admission-authority-evolution-v1.yml";
            const testPath = "scripts/docs-admission-authority-evolution-v1.test.mjs";
            const targetPath = "scripts/verify-docs-admission-change.mjs";
            const expected = new Map([
              ["e3f0f3d2e065b7c0ae324481a3056b7955a0702d", "rollback"],
              ["1bf455f2ca5bf97440e62b2ff4eaa6c36aa2212b", "forward"]
            ]);
            if (!Number.isSafeInteger(pull.changed_files) || pull.changed_files < 1) {
              core.setFailed("Admission authority evolution PR changed_files must be positive.");
              return;
            }
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pull.number, per_page: 100
            });
            if (changed.length !== pull.changed_files ||
                new Set(changed.map(({ filename }) => filename)).size !== changed.length) {
              core.setFailed("Paginated admission authority evidence is incomplete or duplicated.");
              return;
            }
            const allPaths = (file) => [file.filename, file.previous_filename].filter(Boolean);
            if (!changed.some((file) => allPaths(file).includes(targetPath))) {
              core.setOutput("mode", "noop");
              return;
            }
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Admission authority changes from forks are not eligible.");
              return;
            }
            if (changed.length !== 1 || changed[0].filename !== targetPath ||
                changed[0].status !== "modified" || changed[0].previous_filename !== undefined ||
                !expected.has(changed[0].sha)) {
              core.setFailed("This successor accepts only the exact reviewed verifier forward or rollback blob.");
              return;
            }
            const controller = await github.rest.repos.get({
              owner: context.repo.owner, repo: context.repo.repo
            });
            if (pull.base.ref !== controller.data.default_branch) {
              core.setFailed("Admission authority PR must target the live default branch.");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner, branch: controller.data.default_branch,
              repo: context.repo.repo
            });
            if (branch.data.commit.sha !== pull.base.sha) {
              core.setFailed("Admission authority PR base is stale; update it before cutover.");
              return;
            }
            core.setOutput("mode", expected.get(changed[0].sha));
