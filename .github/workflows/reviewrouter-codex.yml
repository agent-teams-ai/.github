name: ReviewRouter Codex OAuth [namespace=sns_805e1404efa0ee03613cabc31b18f2a3;epoch=3;secret=REVIEWROUTER_CODEX_AUTH_JSON_R1316243981_P2e7c56bda356e46d_E3_805e1404efa0ee03613cabc31b18f2a3]

run-name: ${{ format('ReviewRouter review PR {0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

jobs:
  node-compatibility:
    name: node-compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.21.0", "26.10.0"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - name: Install isolated compatibility parser
        run: pnpm --dir tools/node-compatibility-tooling install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --config.engine-strict=true --config.strict-peer-dependencies=true
      - name: Check bounded Node compatibility contract
        run: |
          node scripts/check-node-compatibility.mts
          node --test scripts/check-node-compatibility.test.mts

  codex-review:
    name: codex-review
    needs: node-compatibility
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && (github.event.pull_request.draft == false || vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true') }}
    concurrency:
      group: reviewrouter-codex-oauth-${{ github.repository_id }}-codex-rotating-1316243981
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@8a0a31ae1d92c89466c8a939272a1e333e88c5a0
    with:
      runtime_ref: "8a0a31ae1d92c89466c8a939272a1e333e88c5a0"
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      review_head_sha: ${{ github.event.pull_request.head.sha }}
      provider_instance_id: "codex-rotating:1316243981"
      workflow_schema_version: 4
      max_changed_lines: ${{ vars.REVIEW_ROUTER_MAX_CHANGED_LINES }}
      review_timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON_R1316243981_P2e7c56bda356e46d_E3_805e1404efa0ee03613cabc31b18f2a3 }}

  codex-refresh:
    name: codex-refresh
    needs: node-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reviewrouter-codex-oauth-${{ github.repository_id }}-codex-rotating-1316243981
      cancel-in-progress: false
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      id-token: write
    steps:
      - name: ReviewRouter Codex OAuth refresh
        id: refresh_codex
        uses: 777genius/review-router@8a0a31ae1d92c89466c8a939272a1e333e88c5a0
        with:
          mode: codex-oauth-refresh
          api-url: "https://api.reviewrouter.site"
          provider-instance-id: "codex-rotating:1316243981"
          workflow-schema-version: "4"
          auth-json: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON_R1316243981_P2e7c56bda356e46d_E3_805e1404efa0ee03613cabc31b18f2a3 }}
