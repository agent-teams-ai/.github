name: Trusted Docs Qualification Authority Evolution V12

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-qualification-authority-evolution-v12:
    name: trusted-qualification-authority-evolution-v12
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const workflowPath = ".github/workflows/docs-qualification-authority-evolution-v12.yml";
            const testPath = "scripts/docs-qualification-authority-evolution-v12.test.mjs";
            const expected = new Map([
              ["governance/docs-protocol-policy-v2.json", {
                status: "modified",
                sha: "5550538789d730d076f0ba9a0d4395a5bf202a18"
              }],
              ["scripts/governance-policy.test.mjs", {
                status: "modified",
                sha: "696bce0d92f2d93b8ded77a4611166423a54e1a1"
              }]
            ]);
            const authorityPrefixes = [".github/workflows/", "scripts/"];
            const installAuthorityNames = new Set([
              ".node-version", ".npmrc", ".pnpmfile.cjs", "package.json", "pnpm-lock.yaml",
              "pnpm-workspace.yaml", "renovate-config.json", "renovate.json"
            ]);
            const isAuthorityPath = (path) => path === workflowPath || path === testPath ||
              authorityPrefixes.some((prefix) => path.startsWith(prefix)) ||
              (path.startsWith("governance/") && path.endsWith(".schema.json")) ||
              installAuthorityNames.has(path.split("/").at(-1));
            const cap = 100;
            if (!Number.isSafeInteger(pull.changed_files) || pull.changed_files < 1 ||
                pull.changed_files > cap) {
              core.setFailed(`Docs qualification authority PR changed_files must be within 1..${cap}.`);
              return;
            }
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });
            if (changed.length !== pull.changed_files ||
                new Set(changed.map(({ filename }) => filename)).size !== changed.length) {
              core.setFailed("Paginated Docs qualification authority evidence is incomplete or duplicated.");
              return;
            }
            const allPaths = (file) => [file.filename, file.previous_filename].filter(Boolean);
            if (!changed.some((file) => allPaths(file).some(isAuthorityPath))) {
              core.setOutput("mode", "noop");
              return;
            }
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Docs qualification authority changes from forks are not eligible.");
              return;
            }
            if (changed.length !== expected.size) {
              core.setFailed("This successor accepts only the exact reviewed stable10 admission and rollout-fixture slice.");
              return;
            }
            for (const file of changed) {
              const reviewed = expected.get(file.filename);
              if (reviewed === undefined || file.status !== reviewed.status ||
                  file.sha !== reviewed.sha || file.previous_filename !== undefined) {
                core.setFailed("This successor accepts only the exact reviewed stable10 admission and rollout-fixture slice.");
                return;
              }
            }
            const controller = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (pull.base.ref !== controller.data.default_branch) {
              core.setFailed("Docs qualification authority PR must target the live default branch.");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: controller.data.default_branch
            });
            if (branch.data.commit.sha !== pull.base.sha) {
              core.setFailed("Docs qualification authority PR base is stale; update it before cutover.");
              return;
            }
            core.setOutput("mode", "authority");
