name: Commit author identity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  identity:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/commit-author-identity-check.yml
