name: Trusted Platform Recovery Installation r317

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  node-compatibility:
    name: node-compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.21.0", "26.10.0"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - name: Install isolated compatibility parser
        run: pnpm --dir tools/node-compatibility-tooling install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --config.engine-strict=true --config.strict-peer-dependencies=true
      - name: Check bounded Node compatibility contract
        run: |
          node scripts/check-node-compatibility.mjs
          node --test scripts/check-node-compatibility.test.mjs

  trusted-platform-recovery-installation-r317:
    name: trusted-platform-recovery-installation-r317
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: 24.21.0
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - name: Verify exact incident installation from protected base
        env:
          GH_TOKEN: ${{ secrets.DOCS_GOVERNANCE_READ_TOKEN || github.token }}
          DOCS_R317_ACCEPTED_TUPLE_COMMENT_ID: ${{ vars.DOCS_R317_ACCEPTED_TUPLE_COMMENT_ID }}
        run: node scripts/verify-docs-platform-recovery-installation-r317.mjs
