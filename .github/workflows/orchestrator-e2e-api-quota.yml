name: Observe Actions API quota for Orchestrator migration

on:
  push:
    branches:
      - diagnostics/orchestrator-e2e-api-quota-20261127

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read current installation API quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          failed = False
          for label, url in (
              ("candidate_pull", "https://api.github.com/repos/agent-teams-ai/.github/pulls/463"),
              ("generic_rate", "https://api.github.com/rate_limit"),
          ):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "orchestrator-e2e-quota-observation",
                  },
              )
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  status = response.status
                  body = json.load(response)
                  record = {
                      "observed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "endpoint": label,
                      "status": status,
                      "headers": {key: response.headers.get(key) for key in (
                          "x-ratelimit-limit", "x-ratelimit-remaining", "x-ratelimit-reset",
                          "x-ratelimit-resource", "retry-after",
                      )},
                  }
                  if label == "candidate_pull" and status == 200:
                      record["pull"] = {"number": body["number"], "head": body["head"]["sha"], "base": body["base"]["sha"]}
                      failed |= body["number"] != 463 or body["head"]["sha"] != "15cf953bb8017312be05b70ba1dff6c45a0aa951" or body["base"]["sha"] != "997f24396598f93cf1b03bb26436a5ec7686ddef"
                  if label == "generic_rate" and status == 200:
                      core = body["resources"]["core"]
                      record["core"] = {key: core[key] for key in ("limit", "remaining", "used", "reset")}
                  failed |= status != 200
                  print(json.dumps(record, sort_keys=True))
          raise SystemExit(1 if failed else 0)
          PY
