name: Trusted commit author identity
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: commit-author-identity-${{ github.repository }}
  cancel-in-progress: false
jobs:
  identity:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const need = (ok, message) => { if (!ok) throw new Error(message); };
            const sha = value => typeof value === "string" && /^(?!0{40}$)[0-9a-f]{40}$/u.test(value);
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const central = { owner: "agent-teams-ai", repo: ".github" };
            const policyPath = "governance/commit-author-identity.json";
            const templatePath = "scripts/fixtures/commit-author-identity-caller.yml";
            const callerPath = ".github/workflows/commit-author-identity.yml";
            const localCall = "./.github/workflows/commit-author-identity-check.yml";
            const remoteCall = "agent-teams-ai/.github/.github/workflows/commit-author-identity-check.yml@";
            const statusContext = "commit-author-identity";
            let observed;
            const status = async state => github.rest.repos.createCommitStatus({ owner, repo,
              sha: observed.head.sha, context: statusContext, state,
              description: `Trusted commit author identity: ${state}` });
            const trees = new Map();
            const content = async (coordinates, path, ref) => {
              const data = (await github.rest.repos.getContent({ ...coordinates, path, ref })).data;
              need(data.type === "file" && data.encoding === "base64" && sha(data.sha), "Missing regular identity authority/caller");
              const key = `${coordinates.owner}/${coordinates.repo}@${ref}`;
              if (!trees.has(key)) {
                const tree = (await github.rest.git.getTree({ ...coordinates, tree_sha: ref, recursive: "true" })).data;
                need(tree.truncated === false && Array.isArray(tree.tree), "Incomplete immutable Git tree");
                trees.set(key, tree.tree);
              }
              const entries = trees.get(key).filter(entry => entry.path === path);
              need(entries.length === 1 && entries[0].type === "blob" && ["100644", "100755"].includes(entries[0].mode) &&
                entries[0].sha === data.sha, "Identity authority/caller must be a regular Git file with matching blob");
              return { blob: data.sha, text: Buffer.from(data.content, "base64").toString("utf8") };
            };
            const snapshot = pull => JSON.stringify([pull.id, pull.number, pull.state, pull.merged,
              pull.base?.sha, pull.base?.ref, pull.base?.repo?.id, pull.base?.repo?.full_name,
              pull.head?.sha, pull.head?.repo?.id, pull.head?.repo?.full_name,
              pull.user?.login, pull.user?.type, pull.commits]);
            const human = user => user?.type === "User" && typeof user.login === "string" &&
              user.login.length > 0 && !/\[bot\]|^(github|web-flow)$/iu.test(user.login);
            try {
              need(context.eventName === "pull_request_target" && owner === central.owner &&
                Number.isSafeInteger(context.payload.pull_request?.number) && context.payload.pull_request.number > 0, "Requires a trusted organization PR event");
              const pull_number = context.payload.pull_request.number;
              const readPull = async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              observed = await readPull();
              need(sha(observed.head?.sha), "Missing independently observed PR head");
              await status("pending");
              const controller = (await github.rest.repos.get({ owner, repo })).data;
              need(observed.number === pull_number && observed.state === "open" && observed.merged === false &&
                observed.base?.repo?.full_name === repository && observed.base.repo.id === controller.id &&
                observed.base.ref === controller.default_branch && sha(observed.base.sha) &&
                Number.isSafeInteger(observed.head.repo?.id) && observed.head.repo.id > 0, "PR must target the live default branch");
              const centralBranch = (await github.rest.repos.getBranch({ ...central, branch: "main" })).data;
              need(sha(centralBranch.commit?.sha), "Missing trusted central revision");
              const policyData = await content(central, policyPath, centralBranch.commit.sha);
              const policy = JSON.parse(policyData.text);
              const identity = policy.owner;
              need(policy.schema_version === 1 && human({ type: "User", login: identity?.login }) &&
                typeof identity.name === "string" && identity.name.length > 0 &&
                typeof identity.email === "string" && identity.email.includes("@"), "Invalid owner identity policy");
              const template = await content(central, templatePath, centralBranch.commit.sha);
              const baseCaller = await content({ owner, repo }, callerPath, observed.base.sha);
              const headCaller = await content({ owner, repo }, callerPath, observed.head.sha);
              const pin = /uses: agent-teams-ai\/\.github\/\.github\/workflows\/commit-author-identity-check\.yml@([0-9a-f]{40})\s*$/u.exec(baseCaller.text)?.[1];
              const headPin = /uses: agent-teams-ai\/\.github\/\.github\/workflows\/commit-author-identity-check\.yml@([0-9a-f]{40})\s*$/u.exec(headCaller.text)?.[1];
              const call = repository === "agent-teams-ai/.github" && baseCaller.text.includes(`uses: ${localCall}`)
                ? localCall : sha(pin) ? remoteCall + pin : null;
              const headCall = call === localCall ? localCall : sha(headPin) ? remoteCall + headPin : null;
              need(call && baseCaller.text === template.text.replace(remoteCall + "CENTRAL_REVISION", call) &&
                headCall && headCaller.text === template.text.replace(remoteCall + "CENTRAL_REVISION", headCall) &&
                (call !== localCall || headCaller.blob === baseCaller.blob), "Required caller is absent, broken, or changed beyond an immutable pin");
              const implementationPath = localCall.slice(2);
              let implementation;
              if (call !== localCall && headPin !== pin) {
                implementation = await content(central, implementationPath, centralBranch.commit.sha);
                need((await content(central, implementationPath, headPin)).blob === implementation.blob,
                  "Caller upgrade target differs from the reviewed current central implementation");
              }
              if (repository === "agent-teams-ai/.github" && call === localCall) {
                const path = localCall.slice(2);
                const baseWorkflow = await content({ owner, repo }, path, observed.base.sha);
                const headWorkflow = await content({ owner, repo }, path, observed.head.sha);
                need(baseWorkflow.blob === headWorkflow.blob, "Local reusable workflow changed; stage a reviewed successor");
              }
              need(human(observed.user), "Bot/GitHub PR authors are forbidden even with owner source commits");
              need(Number.isSafeInteger(observed.commits) && observed.commits >= 1 && observed.commits <= 250,
                "Complete commit evidence requires 1..250 PR commits; split larger PRs");
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number, per_page: 100 });
              need(commits.length === observed.commits && commits.every(commit => sha(commit.sha)) &&
                new Set(commits.map(commit => commit.sha)).size === commits.length &&
                commits.at(-1)?.sha === observed.head.sha, "Incomplete or mismatched current-head commit evidence");
              for (const commit of commits) {
                const author = commit.commit?.author;
                need(author && typeof author.name === "string" && author.name.trim() &&
                  typeof author.email === "string" && author.email.includes("@"), "Missing Git author metadata");
                need(!/\[bot\]|^(github|web-flow)$/iu.test(author.name.trim()) &&
                  !/\[bot\]|^noreply@github\.com$/iu.test(author.email.trim()) &&
                  (commit.author === null || human(commit.author)), "Bot/GitHub commit AUTHOR is forbidden");
                need(!/^(?:codex|openai(?: codex)?)$/iu.test(author.name.trim()) &&
                  !/^(?:codex|openai)@(?:openai\.com|users\.noreply\.github\.com)$/iu.test(author.email.trim()),
                  "Codex/OpenAI source commit AUTHOR is forbidden");
                const ownerAuthor = commit.author?.login.toLowerCase() === identity.login.toLowerCase() ||
                  (commit.author === null && author.name.toLowerCase() === identity.name.toLowerCase()) || author.email === identity.email;
                need(!ownerAuthor || [author, commit.commit?.committer].every(person =>
                  person?.name === identity.name && person.email === identity.email),
                  "Owner source commits require exact raw author AND committer name/email");
              }
              const latest = (await github.rest.repos.getBranch({ ...central, branch: "main" })).data;
              need(sha(latest.commit?.sha), "Missing trusted central revision");
              need((await content(central, policyPath, latest.commit.sha)).blob === policyData.blob &&
                (await content(central, templatePath, latest.commit.sha)).blob === template.blob,
                "Central identity policy/caller changed during verification");
              if (implementation) need((await content(central, implementationPath, latest.commit.sha)).blob === implementation.blob &&
                (await content(central, implementationPath, headPin)).blob === implementation.blob,
                "Central implementation/upgrade target changed during verification");
              const currentController = (await github.rest.repos.get({ owner, repo })).data;
              const current = await readPull();
              need(snapshot(current) === snapshot(observed) && currentController.id === controller.id &&
                currentController.default_branch === controller.default_branch, "PR identity/head/base changed during verification");
              // Statuses are shared by SHA: a human PR must not bless a Bot PR with the same head.
              const open = await github.paginate(github.rest.pulls.list, { owner, repo,
                state: "open", base: controller.default_branch, per_page: 100 });
              need(open.some(pull => pull.number === pull_number && pull.head?.sha === observed.head.sha) &&
                open.filter(pull => pull.head?.sha === observed.head.sha).every(pull => human(pull.user)),
                "Conflicting Bot/GitHub PR author on the same head");
              await status("success");
            } catch (error) {
              if (sha(observed?.head?.sha)) {
                try { await status("failure"); } catch { core.warning("Could not publish failure; job failed and status state is unknown"); }
              }
              core.setFailed(error.message);
            }
