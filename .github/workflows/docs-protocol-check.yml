name: Documentation Protocol Check

on:
  workflow_call: {}

permissions:
  contents: read
  id-token: write

jobs:
  docs-protocol-check:
    name: docs-protocol-check
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRUSTED_GOVERNANCE_ROOT: ${{ github.workspace }}/.trusted/governance
      CONSUMER_CHECKOUT: ${{ github.workspace }}/.trusted/consumer
      AUTHORIZATION_PATH: ${{ github.workspace }}/.trusted/docs-gate-authorization.json
      TRUSTED_INSTALL_ROOT: ${{ github.workspace }}/.trusted/install
    steps:
      - name: Resolve trusted controller snapshot and called-workflow identity
        id: authority
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
        with:
          script: |
            const expectedRepository = "agent-teams-ai/.github";
            const expectedPath = ".github/workflows/docs-protocol-check.yml";
            const audience = "agent-teams-docs-gate";
            const token = await core.getIDToken(audience);
            const segments = token.split(".");
            if (segments.length !== 3) {
              throw new Error("GitHub OIDC token is malformed.");
            }
            let claims;
            try {
              claims = JSON.parse(Buffer.from(segments[1], "base64url").toString("utf8"));
            } catch {
              throw new Error("GitHub OIDC claims are malformed.");
            }
            const sha = claims.job_workflow_sha;
            const workflowRef = claims.job_workflow_ref;
            const expectedRef = expectedRepository + "/" + expectedPath + "@" + sha;
            if (claims.iss !== "https://token.actions.githubusercontent.com" ||
                claims.aud !== audience ||
                claims.repository !== context.repo.owner + "/" + context.repo.repo ||
                String(claims.repository_id) !== process.env.CALLER_REPOSITORY_ID ||
                claims.sha !== context.sha || claims.ref !== context.ref ||
                !/^(?!0{40}$)[0-9a-f]{40}$/.test(sha ?? "") ||
                workflowRef !== expectedRef) {
              throw new Error("Called reusable workflow identity is not the exact pinned controller workflow.");
            }
            core.setOutput("workflow-sha", sha);
            core.setOutput("workflow-ref", workflowRef);
            core.setOutput("workflow-repository", expectedRepository);
            core.setOutput("workflow-file-path", expectedPath);
            const controller = await github.rest.repos.get({
              owner: "agent-teams-ai",
              repo: ".github"
            });
            if (controller.data.id !== 1316243981 ||
                controller.data.full_name !== expectedRepository ||
                controller.data.archived || controller.data.disabled) {
              throw new Error("Live controller repository identity is invalid.");
            }
            const branch = await github.rest.repos.getBranch({
              owner: "agent-teams-ai",
              repo: ".github",
              branch: controller.data.default_branch
            });
            const revision = branch.data.commit.sha;
            if (!/^(?!0{40}$)[0-9a-f]{40}$/.test(revision)) {
              throw new Error("Current controller snapshot is not an immutable commit SHA.");
            }
            core.setOutput("controller-sha", revision);

      - name: Check out exact Cohort-bound validator implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.workflow-repository }}
          ref: ${{ steps.authority.outputs.workflow-sha }}
          path: .trusted/governance
          persist-credentials: false

      - name: Set up pnpm for trusted tooling
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node for trusted tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: ${{ env.TRUSTED_GOVERNANCE_ROOT }}/pnpm-lock.yaml

      - name: Install only base-owned validator dependencies
        run: >-
          pnpm install --dir "$TRUSTED_GOVERNANCE_ROOT" --frozen-lockfile
          --ignore-scripts --ignore-pnpmfile

      - name: Authorize exact consumer snapshot without executing consumer code
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.sha }}
          CONTROLLER_SNAPSHOT_SHA: ${{ steps.authority.outputs.controller-sha }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.workflow-sha }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.workflow-ref }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.workflow-repository }}
          JOB_WORKFLOW_FILE_PATH: ${{ steps.authority.outputs.workflow-file-path }}

      - name: Check out authorized immutable consumer snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted/consumer
          persist-credentials: false

      - name: Bind checkout bytes to central authorization
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" verify-checkout
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Prepare isolated exact package installation
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" prepare-install

      - name: Verify isolated lock before package installation
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" verify-install-lock

      - name: Install isolated exact packages without lifecycle scripts
        run: >-
          pnpm install --dir "$TRUSTED_INSTALL_ROOT" --frozen-lockfile
          --ignore-scripts --ignore-pnpmfile

      - name: Verify isolated package identities
        id: trusted-install
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" verify-install

      - name: Confirm current controller authority stayed stable before checks
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" verify-controller-snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run trusted absolute Consumer Integration CLI
        run: >-
          node "${{ steps.trusted-install.outputs.cli }}" consumer check
          --consumer "$CONSUMER_CHECKOUT" --json

      - name: Run trusted absolute documentation structural check
        run: >-
          node "${{ steps.trusted-install.outputs.cli }}" check
          --consumer "$CONSUMER_CHECKOUT"
          --profile "${{ steps.trusted-install.outputs.profile_path }}" --json

      - name: Confirm current controller authority stayed stable through checks
        run: node "$TRUSTED_GOVERNANCE_ROOT/scripts/verify-docs-consumer-gate.mjs" verify-controller-snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
