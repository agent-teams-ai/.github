name: Trusted Docs Platform Exception Review V1

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-docs-platform-exception-review-v1:
    name: trusted-docs-platform-exception-review-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.DOCS_GOVERNANCE_READ_TOKEN }}
          script: |
            const pull = context.payload.pull_request;
            const workflowPath = ".github/workflows/docs-platform-exception-review-v1.yml";
            const testPath = "scripts/docs-platform-exception-review-v1.test.mjs";
            const exceptionPath = "governance/docs-protocol-exceptions.json";
            const expected = new Map([
              [exceptionPath, { status: "modified", sha: "ac336b865d697b62c938623f2960864e85f7698a" }]
            ]);
            if (!Number.isSafeInteger(pull.changed_files) || pull.changed_files < 1) {
              core.setFailed("Docs governance authority PR changed_files must be a positive safe integer.");
              return;
            }
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });
            if (changed.length !== pull.changed_files ||
                new Set(changed.map(({ filename }) => filename)).size !== changed.length) {
              core.setFailed("Paginated Docs governance authority evidence is incomplete or duplicated.");
              return;
            }
            const allPaths = (file) => [file.filename, file.previous_filename].filter(Boolean);
            if (changed.some((file) => allPaths(file).some((path) =>
              path === workflowPath || path === testPath))) {
              core.setFailed("The Platform exception review successor cannot authorize its own modification.");
              return;
            }
            if (!changed.some((file) => allPaths(file).includes(exceptionPath))) {
              core.setOutput("mode", "noop");
              return;
            }
            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Docs governance authority changes from forks are not eligible.");
              return;
            }
            const invalid = changed.filter((file) => {
              const identity = expected.get(file.filename);
              return file.previous_filename !== undefined || identity === undefined ||
                identity.status !== file.status || identity.sha !== file.sha;
            });
            if (changed.length !== expected.size || invalid.length > 0 ||
                changed.some(({ filename }) => !expected.has(filename))) {
              core.setFailed("This successor accepts only the exact reviewed Platform exception renewal.");
              return;
            }
            const controller = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (pull.base.ref !== controller.data.default_branch) {
              core.setFailed("Docs governance authority PR must target the live default branch.");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: controller.data.default_branch
            });
            if (branch.data.commit.sha !== pull.base.sha) {
              core.setFailed("Platform exception review PR base is stale; update it before cutover.");
              return;
            }
            const platform = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: "agent-teams-platform"
            });
            if (platform.data.id !== 1319378484 ||
                platform.data.full_name !== "agent-teams-ai/agent-teams-platform" ||
                platform.data.private !== true || platform.data.archived || platform.data.disabled) {
              core.setFailed("The Platform repository no longer matches the reviewed private active identity.");
              return;
            }
            try {
              await github.request("GET /repos/{owner}/{repo}/rulesets", {
                owner: context.repo.owner,
                repo: "agent-teams-platform"
              });
              core.setFailed("The Platform rulesets API is now available; the GitHub Free exception must not renew.");
              return;
            } catch (error) {
              if (error.status !== 403 ||
                  !String(error.message).includes("Upgrade to GitHub Pro or make this repository public")) {
                throw error;
              }
            }
            core.setOutput("mode", "exception-review");
