name: Trusted Docs Cohort Authority Evolution V8

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-cohort-authority-evolution-v8:
    name: trusted-cohort-authority-evolution-v8
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - id: materialize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("node:fs/promises");
            const path = require("node:path");
            const pull = context.payload.pull_request;
            const repo = context.repo;
            const oid = /^(?!0{40}$)[0-9a-f]{40}$/u;
            const need = (condition, message) => { if (!condition) throw new Error(message); };
            need(Number.isSafeInteger(pull?.changed_files) && pull.changed_files >= 1 && pull.changed_files <= 3000,
              "Invalid changed_files; expected 1..3000.");
            need(oid.test(pull.base?.sha) && oid.test(pull.head?.sha) &&
              pull.head?.repo?.full_name === `${repo.owner}/${repo.repo}`,
              "Missing exact revisions or foreign head repository.");
            async function currentBase() {
              const controller = await github.rest.repos.get(repo);
              need(typeof controller.data?.default_branch === "string" && controller.data.default_branch &&
                pull.base.ref === controller.data.default_branch, "PR must target the live default branch.");
              const branch = await github.rest.repos.getBranch({ ...repo, branch: controller.data.default_branch });
              need(branch.data?.commit?.sha === pull.base.sha, "PR base is stale.");
              const live = (await github.rest.pulls.get({ ...repo, pull_number: pull.number })).data;
              need(live.state === "open" && live.head?.sha === pull.head.sha && live.base?.sha === pull.base.sha &&
                live.base?.ref === pull.base.ref && live.head?.repo?.full_name === pull.head.repo.full_name &&
                live.changed_files === pull.changed_files, "PR metadata changed or is incomplete.");
            }
            await currentBase();
            const files = await github.paginate(github.rest.pulls.listFiles, { ...repo, pull_number: pull.number, per_page: 100 });
            need(Array.isArray(files) && files.length === pull.changed_files &&
              new Set(files.map(file => file?.filename)).size === files.length, "Incomplete or duplicate pagination.");
            async function tree(revision) {
              const commit = (await github.rest.git.getCommit({ ...repo, commit_sha: revision })).data;
              need(commit?.sha === revision && oid.test(commit.tree?.sha), "Unbound Git commit.");
              const data = (await github.rest.git.getTree({ ...repo, tree_sha: commit.tree.sha, recursive: "true" })).data;
              need(data?.sha === commit.tree.sha && data.truncated === false && Array.isArray(data.tree), "Incomplete or unbound Git tree.");
              return data;
            }
            const baseTree = await tree(pull.base.sha);
            const headTree = await tree(pull.head.sha);
            // Cohort-only data keeps the negative emergency route free of dependency installation.
            const cohortData = file => typeof file?.filename === "string" && oid.test(file.sha) &&
              file.previous_filename === undefined && !file.filename.split("/").includes("node_modules") &&
              !/(?:^|\/)(?:package(?:-lock)?\.json|npm-shrinkwrap\.json)$/u.test(file.filename) &&
              (file.filename === "governance/docs-qualified-cohorts.json" ? file.status === "modified" :
                file.status === "added" && (/^governance\/evidence\/docs-cohorts\/[a-z0-9][a-z0-9._/-]*\.(?:json|md)$/u.test(file.filename) ||
                  /^governance\/docs-runtime-closures\/sha256-[0-9a-f]{64}\.json$/u.test(file.filename)));
            if (files.every(cohortData)) {
              const maps = [baseTree, headTree].map(data => {
                const entries = new Map();
                for (const entry of data.tree) {
                  need(typeof entry?.path === "string" && !/[\\\0]/u.test(entry.path) &&
                    entry.path.split("/").every(part => part && part !== "." && part !== "..") && oid.test(entry.sha) &&
                    (entry.type === "blob" ? ["100644", "100755", "120000"].includes(entry.mode) :
                      entry.type === "tree" ? entry.mode === "040000" : entry.type === "commit" && entry.mode === "160000") &&
                    !entries.has(entry.path), "Malformed or duplicate Git entry.");
                  entries.set(entry.path, entry);
                }
                for (const name of ["package.json", "pnpm-lock.yaml", "scripts/check-docs-verifier-authority.mts"]) {
                  need(entries.get(name)?.type === "blob" && entries.get(name)?.mode === "100644", "Missing regular base/head authority.");
                }
                return entries;
              });
              const declared = new Set(files.map(file => file.filename));
              for (const file of files) {
                const before = maps[0].get(file.filename), after = maps[1].get(file.filename);
                need(after?.sha === file.sha && after.type === "blob" && after.mode === "100644" &&
                  (file.status === "added" ? !before : before?.type === "blob" && before.mode === "100644"), "Unbound Cohort file metadata.");
              }
              for (const name of new Set([...maps[0].keys(), ...maps[1].keys()])) {
                const before = maps[0].get(name), after = maps[1].get(name);
                const same = before?.sha === after?.sha && before?.mode === after?.mode && before?.type === after?.type;
                if (name.split("/").includes("node_modules")) need(same, "Resolution shadow changed.");
                if (before?.type === "tree" || after?.type === "tree") continue;
                need(same || declared.has(name), "Unlisted change outside Cohort data.");
              }
              await currentBase();
              core.setOutput("mode", "noop");
              return;
            }
            const headData = {};
            for (const filePath of ["package.json", "pnpm-lock.yaml"]) {
              const entries = headTree.tree.filter(entry => entry?.path === filePath);
              need(entries.length === 1 && entries[0].type === "blob" && entries[0].mode === "100644" &&
                Number.isSafeInteger(entries[0].size) && entries[0].size > 0 &&
                entries[0].size <= (filePath === "package.json" ? 65536 : 2 * 1024 * 1024), "Invalid or oversized head data entry.");
              const blob = (await github.rest.git.getBlob({ ...repo, file_sha: entries[0].sha })).data;
              need(blob?.sha === entries[0].sha && blob.encoding === "base64" && typeof blob.content === "string" &&
                blob.size === entries[0].size && blob.content.length <= 3 * 1024 * 1024, "Incomplete or unbound head data.");
              headData[filePath] = blob;
            }
            await currentBase();
            const output = path.join(process.env.RUNNER_TEMP, "docs-verifier-authority.json");
            await fs.writeFile(output, JSON.stringify({ changedFiles: pull.changed_files, files, baseTree, headTree, headData }), { flag: "wx" });
            core.setOutput("evidence-path", output);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.materialize.outputs.mode != 'noop'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        if: steps.materialize.outputs.mode != 'noop'
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.materialize.outputs.mode != 'noop'
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install only trusted base dependencies
        if: steps.materialize.outputs.mode != 'noop'
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Compare head data with base-owned verifier authority
        if: steps.materialize.outputs.mode != 'noop'
        env:
          AUTHORITY_EVIDENCE: ${{ steps.materialize.outputs.evidence-path }}
        run: node scripts/check-docs-verifier-authority.mts "$AUTHORITY_EVIDENCE"
