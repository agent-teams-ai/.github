name: Trusted Cohort Authority Evolution V2

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-cohort-authority-evolution-v2:
    name: trusted-cohort-authority-evolution-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const authority = new Set([
              ".github/workflows/docs-cohort-authority-evolution-v2.yml",
              "scripts/docs-cohort-policy.mjs",
              "scripts/verify-docs-cohort-evidence.mjs",
              "scripts/verify-docs-consumer-gate.mjs"
            ]);
            const expected = new Map([
              ["scripts/docs-cohort-policy.mjs", "modified"],
              ["scripts/verify-docs-cohort-evidence.mjs", "modified"],
              ["scripts/verify-docs-consumer-gate.mjs", "modified"],
              ["scripts/docs-cohort-policy.test.mjs", "modified"],
              ["docs/decisions/README.md", "modified"],
              ["docs/decisions/0002-fix-forward-cohort-deployability.md", "added"]
            ]);
            const cap = 16;
            if (!Number.isSafeInteger(pull.changed_files) || pull.changed_files < 1 ||
                pull.changed_files > cap) {
              core.setFailed(`Cohort authority PR changed_files must be within 1..${cap}.`);
              return;
            }
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });
            if (changed.length !== pull.changed_files ||
                new Set(changed.map(({ filename }) => filename)).size !== changed.length) {
              core.setFailed("Paginated Cohort authority evidence is incomplete or duplicated.");
              return;
            }
            const allPaths = (file) => [file.filename, file.previous_filename].filter(Boolean);
            const changesAuthority = changed.some((file) =>
              allPaths(file).some((path) => authority.has(path)));
            if (!changesAuthority) {
              core.setOutput("mode", "noop");
              return;
            }
            if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Cohort authority changes from forks are not eligible.");
              return;
            }
            const invalid = changed.filter((file) =>
              file.previous_filename !== undefined ||
              expected.get(file.filename) !== file.status);
            if (changed.length !== expected.size || invalid.length > 0 ||
                changed.some(({ filename }) => !expected.has(filename))) {
              core.setFailed("This successor check accepts only the exact reviewed fix-forward Cohort authority slice.");
              return;
            }
            const controller = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (pull.base.ref !== controller.data.default_branch) {
              core.setFailed("Cohort authority PR must target the live default branch.");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: controller.data.default_branch
            });
            if (branch.data.commit.sha !== pull.base.sha) {
              core.setFailed("Cohort authority PR base is stale; update it before cutover.");
              return;
            }
            core.setOutput("mode", "authority");
