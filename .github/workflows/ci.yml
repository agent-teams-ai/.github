name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: organization-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: 24.18.0
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - name: Install isolated compatibility parser
        run: pnpm --dir scripts/node-compatibility-tooling install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --config.engine-strict=true --config.strict-peer-dependencies=true
      - name: Check Node compatibility contract
        run: |
          node scripts/check-node-compatibility.mjs
          node --test scripts/check-node-compatibility.test.mjs
      - run: |
          pnpm install --frozen-lockfile --config.engine-strict=true --config.strict-peer-dependencies=true
          pnpm peers check --lockfile-only
          pnpm install --lockfile-only --resolution-only --ignore-scripts --ignore-pnpmfile --config.engine-strict=true --config.strict-peer-dependencies=true
          git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm check

  node26-compatibility:
    name: node26-compatibility (Node 26.10.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: 26.10.0
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - name: Install isolated compatibility parser
        run: pnpm --dir scripts/node-compatibility-tooling install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --config.engine-strict=true --config.strict-peer-dependencies=true
      - name: Check Node compatibility contract
        run: |
          node scripts/check-node-compatibility.mjs
          node --test scripts/check-node-compatibility.test.mjs
