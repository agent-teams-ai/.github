name: Qualified Docs Fleet Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  node-compatibility:
    name: node-compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.21.0", "26.10.0"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - name: Install isolated compatibility parser
        run: pnpm --dir tools/node-compatibility-tooling install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --config.engine-strict=true --config.strict-peer-dependencies=true
      - name: Check bounded Node compatibility contract
        run: |
          node scripts/check-node-compatibility.mjs
          node --test scripts/check-node-compatibility.test.mjs

  current-fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prove selected Node runtime
        env:
          EXPECTED_NODE_VERSION: 24.21.0
        run: node -e "if (process.version !== 'v' + process.env.EXPECTED_NODE_VERSION) throw Error('Node runtime mismatch')"
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Verify every current consumer head
        env:
          GH_TOKEN: ${{ secrets.DOCS_GOVERNANCE_READ_TOKEN || github.token }}
          DOCS_GOVERNANCE_READ_TOKEN: ${{ secrets.DOCS_GOVERNANCE_READ_TOKEN }}
        run: node scripts/verify-docs-cohort-evidence.mjs --admission-policy governance/docs-protocol-policy-v2.json
