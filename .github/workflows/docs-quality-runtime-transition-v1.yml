name: Qualified Platform Retirement Transition V1

on:
  push:
    branches:
      - governance/quality-runtime-transition-v1

permissions:
  contents: read

concurrency:
  group: quality-runtime-retirement-v1
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Check the dedicated transition TypeScript project
        run: pnpm exec tsc --project tsconfig.docs-quality-runtime-transition-v1.json
      - name: Lint every new transition source and test
        run: >-
          pnpm exec oxlint --config oxlint.json --no-ignore --disable-nested-config --deny-warnings
          scripts/docs-quality-runtime-transition-v1.ts
          scripts/docs-platform-retirement-admission-v1.ts
          scripts/docs-quality-runtime-transition-v1.test.ts
          scripts/docs-platform-retirement-admission-v1.test.ts
      - name: Exercise accepting and rejecting transition cases
        run: >-
          node --test scripts/docs-quality-runtime-transition-v1.test.ts
          scripts/docs-platform-retirement-admission-v1.test.ts
      - name: Verify the actual immutable source and exact live target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/docs-quality-runtime-transition-v1.ts qualify

  admission:
    name: admission
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Verify retirement schemas, references and full current Docs evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.DOCS_GOVERNANCE_READ_TOKEN || github.token }}
          DOCS_GOVERNANCE_READ_TOKEN: ${{ secrets.DOCS_GOVERNANCE_READ_TOKEN }}
        run: node scripts/docs-platform-retirement-admission-v1.ts

  publish:
    name: publish
    needs: [qualify, admission]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      - name: Reread source, target, protection and this run before publishing new results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/docs-quality-runtime-transition-v1.ts publish
