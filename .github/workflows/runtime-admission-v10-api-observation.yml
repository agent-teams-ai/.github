name: V10 GitHub API response observation

on:
  push:
    branches: [qualification/runtime-admission-v10-api-observation-20261127]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  observe:
    if: ${{ github.repository == 'agent-teams-ai/.github' && github.repository_id == '1316243981' && github.event_name == 'push' && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Observe the exact failed read endpoint once
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          observation_root="$(mktemp -d "$RUNNER_TEMP/v10-api-read-observation.XXXXXXXX")"
          : > "$observation_root/response.headers"
          : > "$observation_root/response.json"
          printf 'repository=%s run=%s attempt=%s revision=%s observed_at=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)"
          printf '%s\n' 'GET /repos/agent-teams-ai/.github/pulls?state=open&base=main&per_page=100&page=1'
          set +e
          http_status="$(curl --disable --silent --show-error --request GET \
            --connect-timeout 10 --max-time 30 --max-filesize 8388608 --retry 0 \
            --proto '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --dump-header "$observation_root/response.headers" \
            --output "$observation_root/response.json" \
            --write-out '%{http_code}' \
            'https://api.github.com/repos/agent-teams-ai/.github/pulls?state=open&base=main&per_page=100&page=1')"
          curl_status=$?
          set -e
          printf 'curl_exit=%s http_status=%s\n' "$curl_status" "$http_status"
          sed -nE '/^(HTTP\/|[Dd]ate:|[Xx]-[Rr]ate[Ll]imit-|[Rr]etry-[Aa]fter:|[Xx]-[Gg]it[Hh]ub-[Rr]equest-[Ii][Dd]:|[Xx]-[Aa]ccepted-[Gg]it[Hh]ub-[Pp]ermissions:)/p' \
            "$observation_root/response.headers"
          python3 - "$observation_root/response.json" "$http_status" <<'PY'
          import hashlib, json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if len(raw) > 8388608:
              raise RuntimeError("Response exceeded its finite byte bound")
          print(json.dumps({"responseBytes": len(raw), "responseSha256": hashlib.sha256(raw).hexdigest()}))
          if sys.argv[2] == "200":
              body = json.loads(raw)
              if not isinstance(body, list) or len(body) > 100:
                  raise RuntimeError("Unexpected public pull-request collection")
              print(json.dumps({"publicPullRequestCount": len(body)}))
          else:
              if len(raw) > 65536:
                  raise RuntimeError("Error response exceeds diagnostic log bound; digest retained")
              print(raw.decode("utf-8", errors="strict"))
          PY
          test "$curl_status" -eq 0
          [[ "$http_status" =~ ^[1-5][0-9][0-9]$ ]]
          printf '%s\n' 'Observation only: HTTP success or refusal is recorded; no qualification or earlier-token cause is asserted.'
