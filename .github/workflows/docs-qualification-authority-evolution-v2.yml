name: Trusted Docs Qualification Authority Evolution V2

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-qualification-authority-evolution-v2:
    name: trusted-qualification-authority-evolution-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const successor = new Set([
              ".github/workflows/docs-qualification-authority-evolution-v2.yml",
              "scripts/docs-qualification-authority-evolution-v2.test.mjs"
            ]);
            const expected = new Map([
              [".github/workflows/docs-admission-evidence.yml", { status: "modified", sha: "a9e9e806d2ceabec63b30f1587209bb76982ae47" }],
              [".github/workflows/docs-protocol-check.yml", { status: "modified", sha: "d813b28bf4574fa9bca16abab8725d9ee10f9e1f" }],
              [".github/workflows/organization-inventory-drift.yml", { status: "added", sha: "454895d3558437b884299e9e23402a4dca59ca19" }],
              ["GOVERNANCE.md", { status: "modified", sha: "1c519ccca2cb2d8cb5f392bd858f71e1a9405f6e" }],
              ["README.md", { status: "modified", sha: "114acb6eddf85c7ed8d7e39786bd3bdf8a9dc430" }],
              ["docs/repository-admission.md", { status: "modified", sha: "a40279016009489d9bfe85a1a4c5f1b040d84a6d" }],
              ["governance/docs-protocol-exceptions.json", { status: "modified", sha: "227ff02acba7de7a53a563ae2e93fa0322a1672a" }],
              ["governance/docs-protocol-exceptions.schema.json", { status: "modified", sha: "b38e37acaa5f238f0000dcab581a3f9f69b33873" }],
              ["governance/docs-protocol-policy-v2.json", { status: "added", sha: "2b0cb39bbb6f090a3d4febc143d39023999efe51" }],
              ["governance/docs-protocol-policy-v2.schema.json", { status: "added", sha: "e1ed08c5e442572bb4bb19bc73804bbe4e1017e8" }],
              ["governance/organization-repository-inventory.json", { status: "modified", sha: "39292f445d8e7a6f900421c2e1e0e35121d6af58" }],
              ["governance/organization-repository-inventory.schema.json", { status: "modified", sha: "7d965016cd10a03df67b2c83fb9bd0366b14c779" }],
              ["package.json", { status: "modified", sha: "b908c9a336c726e003f3f73fbbf33f9ff3fd90fb" }],
              ["scripts/check-community-files.mjs", { status: "modified", sha: "e5b1217f466565494605be0f2eae17d1e65b878c" }],
              ["scripts/check-community-files.test.mjs", { status: "modified", sha: "e16c0e58bcf82c16bb5e6e833cf4f2024c0f3e78" }],
              ["scripts/docs-cohort-policy.test.mjs", { status: "modified", sha: "30a9a6e1d951fb4ee28ab649c0c7319e57882f6f" }],
              ["scripts/governance-policy.mjs", { status: "modified", sha: "a6e6066101b043636d6a497bc9c5c0674da418d3" }],
              ["scripts/governance-policy.test.mjs", { status: "modified", sha: "2e7c76454cb45de233c95029d3d3a92956d4a4c3" }],
              ["scripts/observe-org-repository-inventory.mjs", { status: "modified", sha: "63e6697e586698d88c49f0f70add173e3c92dd47" }],
              ["scripts/observe-org-repository-inventory.test.mjs", { status: "added", sha: "4e232469de5a11e4d940df222aabc0e8f81ff80a" }],
              ["scripts/validate-governance.mjs", { status: "modified", sha: "990b2397c561846b64bdcec8cf4164df4bc9c154" }],
              ["scripts/verify-docs-admission-change.mjs", { status: "modified", sha: "5703b7bdc63eac7570e3313255af2f33d7a5faf8" }],
              ["scripts/verify-docs-consumer-gate.mjs", { status: "modified", sha: "98841e872e8e32fcc9301b2ff4ffc14042d7fb51" }],
              ["scripts/verify-docs-consumer-gate.test.mjs", { status: "modified", sha: "2b0316a86ffd90d800a9990d709215d41c25b553" }],
              ["scripts/verify-docs-qualification-receipt.mjs", { status: "added", sha: "bce2bae1df8c13fc35835bdb22fb4af1fa56637e" }],
              ["scripts/verify-docs-qualification-receipt.test.mjs", { status: "added", sha: "39820cd47a6e5b9b76b187dc3ddf2c5b663e0ef8" }]
            ]);
            const authorityPrefixes = [".github/workflows/", "scripts/"];
            const installAuthorityNames = new Set([
              ".node-version", ".npmrc", ".pnpmfile.cjs", "package.json", "pnpm-lock.yaml",
              "pnpm-workspace.yaml", "renovate-config.json", "renovate.json"
            ]);
            const isAuthorityPath = (path) => successor.has(path) || expected.has(path) ||
              authorityPrefixes.some((prefix) => path.startsWith(prefix)) ||
              (path.startsWith("governance/") && path.endsWith(".schema.json")) ||
              installAuthorityNames.has(path.split("/").at(-1));
            const cap = 32;
            if (!Number.isSafeInteger(pull.changed_files) || pull.changed_files < 1 ||
                pull.changed_files > cap) {
              core.setFailed(`Qualification authority PR changed_files must be within 1..${cap}.`);
              return;
            }
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });
            if (changed.length !== pull.changed_files ||
                new Set(changed.map(({ filename }) => filename)).size !== changed.length) {
              core.setFailed("Paginated qualification authority evidence is incomplete or duplicated.");
              return;
            }
            const allPaths = (file) => [file.filename, file.previous_filename].filter(Boolean);
            const changesAuthority = changed.some((file) =>
              allPaths(file).some(isAuthorityPath));
            if (!changesAuthority) {
              core.setOutput("mode", "noop");
              return;
            }
            if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Qualification authority changes from forks are not eligible.");
              return;
            }
            const invalid = changed.filter((file) => {
              const identity = expected.get(file.filename);
              return file.previous_filename !== undefined || identity === undefined ||
                identity.status !== file.status || identity.sha !== file.sha;
            });
            if (changed.length !== expected.size || invalid.length > 0 ||
                changed.some(({ filename }) => !expected.has(filename))) {
              core.setFailed("This successor check accepts only the exact reviewed qualification-v2 authority slice.");
              return;
            }
            const controller = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (pull.base.ref !== controller.data.default_branch) {
              core.setFailed("Qualification authority PR must target the live default branch.");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: controller.data.default_branch
            });
            if (branch.data.commit.sha !== pull.base.sha) {
              core.setFailed("Qualification authority PR base is stale; update it before cutover.");
              return;
            }
            core.setOutput("mode", "authority");
