schemaVersion: 3
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
rootPackage: true
packageRoots: []
governedRoots:
  - scripts
  - tools/feature-module-standard
boundaries:
  - id: governance-tooling
    dependencyMode: development
    roots:
      - scripts
    entrypoints: []
    allow:
      boundaries:
        - feature-module-standard
      packages:
        - ajv
        - yaml
      builtins:
        - node:assert/strict
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:os
        - node:path
        - node:test
        - node:url
        - node:util
        - node:vm
        - node:zlib
      runtimeReferences:
        - commonjs
        - dynamic
  - id: feature-module-standard
    dependencyMode: development
    roots:
      - tools/feature-module-standard
    entrypoints:
      - tools/feature-module-standard/check.mjs
    allow:
      boundaries: []
      packages: []
      builtins:
        - node:assert/strict
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:os
        - node:path
        - node:test
        - node:url
        - node:util
      runtimeReferences: []
